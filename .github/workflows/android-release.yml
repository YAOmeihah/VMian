name: Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Validate signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vmian-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/vmian-release.jks" >> $GITHUB_ENV

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare versioned APK asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSIONED_APK="$RUNNER_TEMP/vmian-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$VERSIONED_APK"
          echo "VERSIONED_APK=$VERSIONED_APK" >> $GITHUB_ENV

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmian-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.VERSIONED_APK }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Read generated release metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json body,publishedAt > "$RUNNER_TEMP/release-view.json"

      - name: Generate update.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION_CODE=$(python - <<'PY'
          import json
          with open("app/build/outputs/apk/release/output-metadata.json", "r", encoding="utf-8") as fh:
              metadata = json.load(fh)
          print(metadata["elements"][0]["versionCode"])
          PY
          )
          VERSION_NAME=$(python - <<'PY'
          import json
          with open("app/build/outputs/apk/release/output-metadata.json", "r", encoding="utf-8") as fh:
              metadata = json.load(fh)
          print(metadata["elements"][0]["versionName"])
          PY
          )
          SHA256=$(python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          apk_path = Path(os.environ["VERSIONED_APK"])
          print(hashlib.sha256(apk_path.read_bytes()).hexdigest())
          PY
          )
          python scripts/generate_update_manifest.py \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --tag "${GITHUB_REF_NAME}" \
            --apk-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "${VERSIONED_APK}")" \
            --sha256 "$SHA256" \
            --release-json "$RUNNER_TEMP/release-view.json" \
            --output "$RUNNER_TEMP/update.json"

      - name: Upload update manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/update.json" \
            --repo "${GITHUB_REPOSITORY}" --clobber
